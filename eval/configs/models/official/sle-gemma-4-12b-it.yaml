name: sle-gemma-4-12b-it
access: open_weights
hf_repo: google/gemma-4-12B-it
family: gemma4
params_hint: 12.0B
tier: official
# A100 80GB tier; multimodal wrapper arch (text-only scoring path).
generation:
  batch_size: 8
  dtype: bfloat16
  # Gemma is trained with <bos> always present (Google documents it);
  # same family as e2b/e4b, both materially improved by BOS.
  prepend_bos: true
  device_map: auto
