name: sle-yugogpt
access: open_weights
hf_repo: gordicaleksa/YugoGPT
family: mistral
# The original Serbian LLM Eval flagship (Mistral-7B continued pretraining
# on BCMS data by Aleksa Gordic, 2024) - a base model, evaluated under the
# same raw-completion loglikelihood protocol as the instruct roster
# (validated instruct ~= base on this protocol).
params_hint: 7.2B
tier: official
# gordicaleksa/YugoGPT ships only a slow sentencepiece tokenizer.model;
# transformers 5.x dropped raw sentencepiece support (its converter tries to
# parse the file as tiktoken and fails), so tokenizer load crashes. YugoGPT's
# tokenizer is byte-identical to mistralai/Mistral-7B-v0.1's on all joint
# context+continuation encodings used by our scoring path (verified
# empirically: full-string and joint encodes match; only standalone
# leading-space fragments differ, a path our runner never uses). Load the
# tokenizer from the base model instead; model weights still come from
# hf_repo above.
tokenizer_repo: mistralai/Mistral-7B-v0.1
generation:
  batch_size: 8
  dtype: bfloat16
  # Mistral-derived tokenizer declares add_bos_token=true
  # (screening delta within noise, applied for protocol consistency).
  prepend_bos: true
